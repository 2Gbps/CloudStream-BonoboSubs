<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Renegade Immortal (Xian Ni) series and movie in 4K, direct from BonoboSubs — CloudStream / ShonenX extension">
<link rel="icon" href="logo.png">
<title>BonoboSubs — CloudStream / ShonenX Extension</title>
<style>
  :root { --accent: #00679e; --bg: #0b0f14; --card: #121820; --border: #2b3a4a; --text: #e6edf3; --muted: #8b98a5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: flex-end; align-items: center;
    padding: 12px 20px; background: rgba(11, 15, 20, 0.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  .install-btn {
    display: inline-block; padding: 10px 18px; border-radius: 8px; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
  }
  .install-btn:hover { filter: brightness(1.15); }
  #readme {
    max-width: 880px; margin: 0 auto; padding: 32px 22px 64px; line-height: 1.6; font-size: 16px;
  }
  #readme h1, #readme h2, #readme h3 { margin: 28px 0 12px; line-height: 1.3; }
  #readme h1 { font-size: 30px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  #readme h2 { font-size: 24px; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-top: 36px; }
  #readme h3 { font-size: 19px; }
  #readme p { margin: 12px 0; }
  #readme a { color: #58a6ff; text-decoration: none; }
  #readme a:hover { text-decoration: underline; }
  #readme img { max-width: 100%; border-radius: 8px; }
  #readme code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13.5px;
    background: #1c2531; border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px;
    word-break: break-all;
  }
  #readme pre {
    background: #1c2531; border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin: 14px 0; overflow-x: auto;
  }
  #readme pre code { background: none; border: none; padding: 0; font-size: 14px; }
  #readme blockquote {
    margin: 14px 0; padding: 10px 18px; border-left: 4px solid var(--accent);
    background: var(--card); border-radius: 0 8px 8px 0; color: var(--muted);
  }
  #readme table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 15px; }
  #readme th, #readme td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; }
  #readme th { background: #1a2330; }
  #readme tr:nth-child(even) td { background: #101720; }
  #readme hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
  #readme ul, #readme ol { margin: 12px 0 12px 26px; }
  #readme li { margin: 6px 0; }
  #readme p[align="center"] { text-align: center; }
  .loading { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="topbar">
  <a class="install-btn" href="install.html">Install BonoboSubs →</a>
</div>
<article id="readme">
  <p class="loading">Loading README…</p>
</article>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  var README_URL = "https://raw.githubusercontent.com/2Gbps/CloudStream-BonoboSubs/main/README.md";
  fetch(README_URL + "?cb=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (md) {
      document.getElementById("readme").innerHTML = marked.parse(md);
    })
    .catch(function (e) {
      document.getElementById("readme").innerHTML =
        '<p class="loading">Failed to load README (' + e.message + ').</p>' +
        '<p class="loading"><a href="install.html" style="color:#58a6ff">Go to install page</a></p>';
    });
</script>
</body>
</html>
