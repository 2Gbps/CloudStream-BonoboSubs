<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="logo.png">
<title>BonoboSubs — CloudStream / AnymeX extension</title>
<style>
  body {
    background: #0d1117; color: #c9d1d9;
    font: 15px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    max-width: 800px; margin: 0 auto; padding: 28px 16px 8px;
  }
  header img { width: 56px; height: 56px; border-radius: 10px; }
  header .t h1 { font-size: 19px; font-weight: 600; color: #e6edf3; margin: 0; }
  header .t p { margin: 2px 0 0; color: #8b949e; font-size: 13px; }
  header a { margin-left: auto; color: #58a6ff; font-size: 14px; white-space: nowrap; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  article {
    max-width: 800px; margin: 0 auto; padding: 8px 16px 72px;
  }
  article img[src*="shields.io"] { display: none; }
  article h1, article h2, article h3 { color: #e6edf3; line-height: 1.3; margin: 30px 0 12px; }
  article h1 { font-size: 24px; }
  article h2 { font-size: 20px; border-bottom: 1px solid #21262d; padding-bottom: 5px; }
  article h3 { font-size: 16px; }
  article p { margin: 12px 0; }
  article a { color: #58a6ff; text-decoration: none; }
  article a:hover { text-decoration: underline; }
  article img { max-width: 100%; }
  article code {
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #161b22; border: 1px solid #30363d; border-radius: 5px; padding: 2px 5px;
    word-break: break-all; color: #c9d1d9;
  }
  article pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px 14px; overflow-x: auto; }
  article pre code { border: 0; background: none; padding: 0; word-break: normal; }
  article blockquote { margin: 14px 0; padding: 0 16px; color: #8b949e; border-left: 3px solid #30363d; }
  article table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  article th, article td { border: 1px solid #30363d; padding: 7px 11px; text-align: left; }
  article th { background: #161b22; color: #e6edf3; }
  article hr { border: 0; border-top: 1px solid #21262d; margin: 26px 0; }
  article ol, article ul { margin: 10px 0 10px 24px; }
  article li { margin: 5px 0; }
  article p[align="center"], article h1[align="center"] { text-align: center; }
  .err { color: #8b949e; text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <div class="t">
    <h1>BonoboSubs</h1>
    <p>Renegade Immortal in 4K — CloudStream / AnymeX extension</p>
  </div>
  <a href="install.html">Install →</a>
</header>
<article id="readme"><p class="err">Loading…</p></article>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  fetch("https://raw.githubusercontent.com/2Gbps/CloudStream-BonoboSubs/main/README.md?cb=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (md) { document.getElementById("readme").innerHTML = marked.parse(md); })
    .catch(function (e) {
      document.getElementById("readme").innerHTML =
        '<p class="err">Failed to load README (' + e.message + ') — <a href="install.html">install page</a></p>';
    });
</script>
</body>
</html>
