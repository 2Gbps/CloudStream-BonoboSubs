name: Sync subtitles

# Mirrors the BonoboSubs share's latest ASS subtitles into SRT files under
# subs/ so the extension can serve a format ShonenX renders out of the box.
# The script only downloads files whose share etag changed, and only commits
# when the converted SRTs actually differ, so idle runs are cheap and quiet.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync_subs.py"
      - ".github/workflows/sync-subs.yml"

permissions:
  contents: write

concurrency:
  group: "sync-subs"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure ffmpeg
        run: command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }

      - name: Sync subtitles from the BonoboSubs share
        run: python scripts/sync_subs.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subs
          if git diff --cached --quiet; then
            echo "No subtitle changes."
          else
            git commit -m "Sync subtitles from BonoboSubs share"
            git pull --rebase origin main
            git push
          fi
