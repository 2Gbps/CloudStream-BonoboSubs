name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          # Rename the .cs3 with a version stamp and rewrite plugins.json to match:
          # raw.githubusercontent and jsdelivr both key their CDN caches on the full
          # URL, so a new filename per build guarantees the app downloads bytes that
          # match the published sha256 (query params are NOT safe — the ShonenX
          # bridge's convertRawGitUrl can mangle them).
          cd $GITHUB_WORKSPACE/builds
          VER=$(python3 -c "import json;print(json.load(open('plugins.json'))[0]['version'])")
          NAME=$(python3 -c "import json;print(json.load(open('plugins.json'))[0]['internalName'])")
          mv "$NAME.cs3" "$NAME-$VER.cs3"
          sed -i "s|$NAME\.cs3|$NAME-$VER.cs3|g" plugins.json

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force
